# ~/.config/hypr/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 3
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2

    inner_color = rgba(20, 20, 20, 0.8)
    outer_color = rgba(150, 150, 150, 0.8)

    font_color = rgb(255, 255, 255)

    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff99">Password...</span>

    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true

    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.9)
    font_size = 24
    font_family = Sans

    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.9)
    font_size = 64
    font_family = Sans

    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = rgba(255, 255, 255, 0.7)
    font_size = 20
    font_family = Sans

    position = 0, 80
    halign = center
    valign = center
}
